[package]
name = "union-bond"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "union_bond"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"

# Anchor's macros emit cfg checks for features that only exist when building for
# the Solana target, so a host build (cargo test) warns about all of them.
[lints.rust]
unexpected_cfgs = { level = "allow" }
