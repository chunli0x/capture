name: Android Build

on:
  push:
    branches: [main, tapfarm/mvp]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      apiBase:
        description: 'Backend API base URL (empty = emulator default 10.0.2.2:8000)'
        required: false
        default: ''

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform (minor-versioned package name)
        run: sdkmanager "platforms;android-37.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          ORG_GRADLE_PROJECT_tapfarmApiBase: ${{ github.event.inputs.apiBase || 'http://10.0.2.2:8000' }}

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_tapfarmApiBase: ${{ github.event.inputs.apiBase || 'http://10.0.2.2:8000' }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tap-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
