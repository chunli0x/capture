services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seeker}
      POSTGRES_DB: ${POSTGRES_DB:-seeker}
    ports:
      # Loopback-only by default: the database is not reachable from other
      # hosts. To expose it (e.g. a remote DB client or a second machine),
      # override the binding via env:
      #   POSTGRES_BIND=0.0.0.0:5432:5432 docker compose up -d
      - "${POSTGRES_BIND:-127.0.0.1:5432:5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seeker} -d ${POSTGRES_DB:-seeker}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
